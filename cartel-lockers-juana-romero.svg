<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 450"
     width="1200" height="450">

  <title>Juana Romero — Cartel Lockers Cuenca 120x45 cm</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,400&amp;family=Montserrat:wght@800;900&amp;family=Inter:wght@300;400&amp;display=swap');
    </style>
    <radialGradient id="gl" cx="12%" cy="50%" r="55%" gradientUnits="userSpaceOnUse"
        fx="144" fy="225" fr="0">
      <stop offset="0%" stop-color="#525252" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#525252" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gr" cx="84%" cy="48%" r="45%" gradientUnits="userSpaceOnUse"
        fx="1008" fy="216" fr="0">
      <stop offset="0%" stop-color="#282828" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#282828" stop-opacity="0"/>
    </radialGradient>
    <!-- Grain noise filter -->
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4"
                    stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blended"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════
       FONDO
  ══════════════════════════════ -->
  <rect width="1200" height="450" fill="#3B3B3B"/>
  <rect width="1200" height="450" fill="url(#gl)"/>
  <rect width="1200" height="450" fill="url(#gr)"/>
  <!-- Textura grano sutil -->
  <rect width="1200" height="450" fill="#3B3B3B" filter="url(#grain)" opacity="0.04"/>

  <!-- ══════════════════════════════
       SEPARADORES
  ══════════════════════════════ -->
  <!-- Vertical izq/centro -->
  <line x1="300" y1="20" x2="300" y2="408"
        stroke="white" stroke-opacity="0.13" stroke-width="1"/>
  <!-- Vertical centro/dcha -->
  <line x1="960" y1="20" x2="960" y2="408"
        stroke="white" stroke-opacity="0.13" stroke-width="1"/>
  <!-- Pie horizontal -->
  <line x1="0" y1="408" x2="1200" y2="408"
        stroke="white" stroke-opacity="0.13" stroke-width="1"/>

  <!-- ══════════════════════════════
       BLOQUE IZQUIERDO: La Autoridad (0–300 px)
  ══════════════════════════════ -->
  <!-- Nombre / Firma -->
  <text x="35" y="178"
        font-family="'Cormorant Garamond','Palatino Linotype','Palatino','Book Antiqua',Georgia,serif"
        font-size="30" font-weight="700"
        fill="#FFFFFF" letter-spacing="3">Juana Romero</text>

  <!-- Línea bajo el nombre -->
  <line x1="35" y1="191" x2="255" y2="192"
        stroke="#C8C8C8" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Subtítulo Contemporary Art -->
  <text x="35" y="210"
        font-family="'Cormorant Garamond','Palatino Linotype','Palatino',Georgia,serif"
        font-size="14" font-style="italic" font-weight="400"
        fill="#9E9E9E" letter-spacing="3.5">Contemporary Art</text>

  <!-- Dirección (bloque izq.) -->
  <text x="35" y="368"
        font-family="'Inter','Helvetica Neue','Calibri',Arial,sans-serif"
        font-size="11" font-weight="300"
        fill="#727272" letter-spacing="1">C/ Alonso Chirino, 7 · Cuenca</text>

  <!-- ══════════════════════════════
       BLOQUE CENTRAL: El Manifiesto (300–960 px)
  ══════════════════════════════ -->
  <text x="345" y="170"
        font-family="'Montserrat','Futura','Century Gothic','Arial Black',sans-serif"
        font-size="40" font-weight="800"
        fill="#FFFFFF" letter-spacing="1">EL ÚNICO LUGAR DONDE</text>

  <text x="345" y="224"
        font-family="'Montserrat','Futura','Century Gothic','Arial Black',sans-serif"
        font-size="40" font-weight="800"
        fill="#FFFFFF" letter-spacing="1">EL ARTE SE TOCA</text>

